[package]
name = "devpulse"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Engineering health metrics from git history: hotspots, ownership, bus factor"
license = "MIT"
repository = "https://github.com/jakhongirjp/devpulse"
keywords = ["git", "metrics", "cli", "engineering", "devops"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
